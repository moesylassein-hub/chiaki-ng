name: Build chiaki-ng Windows x86_64 (VC)

on:
  workflow_dispatch:
  push:
    branches: [main, codex/windows-render-sync]
    paths:
      - "gui/**"
      - "lib/**"
      - "test/session-lifecycle/**"
      - "test/render-sync/**"
      - ".github/workflows/build-windows-x86.yml"

jobs:
  session-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test recovery, packet accounting and controller modes
        run: |
          cmake -S test/session-lifecycle -B build-lifecycle -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-lifecycle
          ctest --test-dir build-lifecycle --output-on-failure --timeout 30
      - name: Test queued decoder lifetime under sanitizers
        run: |
          g++ -std=c++11 -pthread -fsanitize=address,undefined -g -Igui/include test/session-lifecycle/resource.cpp -o /tmp/session-resource-test
          /tmp/session-resource-test

  build-win_x64:
    needs: session-lifecycle
    name: Build chiaki-ng win_x64 (VC)
    runs-on: windows-latest
    env:
      CC: clang-cl.exe
      CXX: clang-cl.exe
      VULKAN_SDK: C:\VulkanSDK\
      triplet: x64-windows
      vcpkg_baseline: 42bb0d9e8d4cf33485afb9ee2229150f79f61a1f
      # Use the pinned CMake from PATH for nested vcpkg port builds too.
      VCPKG_FORCE_SYSTEM_BINARIES: "1"
      VCPKG_KEEP_ENV_VARS: PKG_CONFIG
      dep_folder: deps
      libplacebo_tag: v7.360.1
      sdl2_compat_tag: 2.32.64

    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set vcpkg installed dir
        run: |
          echo "VCPKG_INSTALLED_DIR=${{ github.workspace }}\build\vcpkg_installed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Vulkan
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ver = (Invoke-WebRequest -UseBasicParsing -Uri "https://vulkan.lunarg.com/sdk/latest.json" | ConvertFrom-Json).windows
          echo Version $ver
          Invoke-WebRequest -UseBasicParsing -Uri "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe" -OutFile VulkanSDK.exe
          echo Downloaded
          .\VulkanSDK.exe --root ${{ env.VULKAN_SDK }}  --accept-licenses --default-answer --confirm-command install

      - name: Set up Ninja
        run: choco install ninja

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: 18

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Pin compatible CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.31.6"
          ninjaVersion: "1.12.1"

      - name: Verify build tools
        run: |
          cmake --version
          ninja --version
          if ((cmake --version | Select-Object -First 1) -ne "cmake version 3.31.6") {
            throw "Unexpected CMake version; refusing to build legacy ports with CMake 4."
          }

      - name: Install native pkg-config
        run: |
          choco install pkgconfiglite --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "pkg-config installation failed" }
          $pkgConfig = (Get-Command pkg-config.exe -ErrorAction Stop).Source
          & $pkgConfig --version
          if ($LASTEXITCODE -ne 0) { throw "pkg-config verification failed" }
          "PKG_CONFIG=$pkgConfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Make build directory
        run: |
          mkdir build

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.vcpkg_baseline }}
          runVcpkgInstall: true
          vcpkgJsonGlob: "vcpkg.json"

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.*"
          host: 'windows'
          target: 'desktop'
          modules: 'qtwebengine qtpositioning qtwebchannel qtwebsockets qtserialport'

      - name: Test Qt render synchronization
        run: |
          cmake -S test/render-sync -B build-render-sync -G Ninja -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "Render sync test configure failed" }
          cmake --build build-render-sync
          if ($LASTEXITCODE -ne 0) { throw "Render sync test build failed" }
          ctest --test-dir build-render-sync --output-on-failure --timeout 15
          if ($LASTEXITCODE -ne 0) { throw "Render sync regression failed" }

      - name: Install pip dependencies
        run: |
          ${{ env.pythonLocation }}\python.exe -m pip install --upgrade pip
          ${{ env.pythonLocation }}\python.exe -m pip install --upgrade setuptools wheel
          ${{ env.pythonLocation }}\python.exe -m pip install --user --upgrade scons protobuf grpcio-tools pyinstaller
          ${{ env.pythonLocation }}\python.exe -m pip install --user --upgrade meson
          ${{ env.pythonLocation }}\python.exe -c 'import google.protobuf; print(google.protobuf.__file__)'

      - name: Setup ffmpeg
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip" -OutFile ".\ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip"
          Expand-Archive -LiteralPath "ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip" -DestinationPath "."
          Rename-Item "ffmpeg-n7.1-latest-win64-gpl-shared-7.1" "${{ env.dep_folder }}"

      - name: Setup sdl2-compat
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -UseBasicParsing -Uri https://github.com/libsdl-org/sdl2-compat/releases/download/release-${{ env.sdl2_compat_tag }}/sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip -OutFile sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip
          Expand-Archive -Force -LiteralPath "sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip" -DestinationPath ".\sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64"
          Get-ChildItem -Path ".\sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64\*" -Include "*.dll" | Copy-Item -Force -Destination "${{ env.dep_folder }}\bin"

      - name: Build SPIRV-Cross
        run: |
          git clone https://github.com/KhronosGroup/SPIRV-Cross.git
          cd SPIRV-Cross
          cmake `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}\${{ env.dep_folder }}" `
          -DSPIRV_CROSS_SHARED=ON `
          -S . `
          -B build `
          -G Ninja
          cmake --build build --config Release
          cmake --install build

      - name: Build shaderc
        run: |
          # The former Google Storage prebuilt download is no longer available.
          git clone --depth 1 --branch v2025.3 https://github.com/google/shaderc.git shaderc
          if ($LASTEXITCODE -ne 0) { throw "Shaderc clone failed" }
          Push-Location shaderc
          try {
            & "$env:pythonLocation\python.exe" utils/git-sync-deps
            if ($LASTEXITCODE -ne 0) { throw "Shaderc dependency sync failed" }
          } finally {
            Pop-Location
          }
          cmake -S shaderc -B shaderc/build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/${{ env.dep_folder }}" `
            -DCMAKE_INSTALL_LIBDIR=lib `
            -DSHADERC_SKIP_TESTS=ON `
            -DSHADERC_SKIP_EXAMPLES=ON `
            -DSHADERC_SKIP_EXECUTABLES=OFF `
            -DSHADERC_SKIP_COPYRIGHT_CHECK=ON `
            -DSHADERC_ENABLE_SHARED_CRT=ON `
            -DSHADERC_ENABLE_WERROR_COMPILE=OFF
          if ($LASTEXITCODE -ne 0) { throw "Shaderc configure failed" }
          cmake --build shaderc/build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Shaderc build failed" }
          cmake --install shaderc/build --config Release
          if ($LASTEXITCODE -ne 0) { throw "Shaderc install failed" }
          foreach ($file in @('bin/shaderc_shared.dll', 'lib/shaderc_shared.lib', 'lib/pkgconfig/shaderc.pc', 'include/shaderc/shaderc.h')) {
            if (!(Test-Path "${{ env.dep_folder }}/$file")) { throw "Missing shaderc output: $file" }
          }

      - name: Build libplacebo
        run: |
          git clone --recursive https://github.com/haasn/libplacebo.git
          cd libplacebo
          git checkout --recurse-submodules ${{ env.libplacebo_tag }}
          meson setup `
          --prefix "${{ github.workspace }}\${{ env.dep_folder }}" `
          --native-file ../meson.ini `
          "--pkg-config-path=['${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\lib\pkgconfig','${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\share\pkgconfig','${{ github.workspace }}\${{ env.dep_folder }}\lib\pkgconfig']" `
          "--cmake-prefix-path=['${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}', '${{ env.VULKAN_SDK }}', '${{ github.workspace }}\${{ env.dep_folder }}']" `
          -Dc_args="/I ${{ env.VULKAN_SDK }}Include" `
          -Dcpp_args="/I ${{ env.VULKAN_SDK }}Include" `
          -Dc_link_args="/LIBPATH:${{ env.VULKAN_SDK }}Lib" `
          -Dcpp_link_args="/LIBPATH:${{ env.VULKAN_SDK }}Lib" `
          -Ddemos=false `
          ./build
          ninja -C./build
          ninja -C./build install

      - name: Apply Patches
        run: |
          git apply --ignore-whitespace --verbose --directory=third-party/gf-complete/ scripts/windows-vc/gf-complete.patch

      - name: Configure chiaki-ng
        run: |
          cmake `
          -S . `
          -B build `
          -G Ninja `
          -DCMAKE_TOOLCHAIN_FILE:STRING="vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_MANIFEST_INSTALL=OFF `
          -DVCPKG_INSTALLED_DIR="${env:VCPKG_INSTALLED_DIR}" `
          -DVCPKG_TARGET_TRIPLET="${{ env.triplet }}" `
          -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=TRUE `
          -DCMAKE_BUILD_TYPE=RelWithDebInfo `
          -DCHIAKI_ENABLE_CLI=OFF `
          -DCHIAKI_GUI_ENABLE_SDL_GAMECONTROLLER=ON `
          -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF `
          -DPYTHON_EXECUTABLE="${{ env.pythonLocation }}\python.exe" `
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}\${{ env.dep_folder }};${{ env.VULKAN_SDK }}"

      - name: Build chiaki-ng
        run: |
          cmake --build build --config RelWithDebInfo --clean-first --target chiaki

      - name: Prepare Qt deployment package
        run: |
          mkdir chiaki-ng-Win
          cp build\gui\chiaki.exe chiaki-ng-Win
          cp scripts\windows-vc\diagnose.ps1 chiaki-ng-Win
          @("Commit: ${{ github.sha }}", "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "Configuration: RelWithDebInfo", "Qt: $(qmake -query QT_VERSION)") | Set-Content chiaki-ng-Win\build-info.txt
          cp build\third-party\cpp-steam-tools\cpp-steam-tools.dll chiaki-ng-Win
          cp scripts\qtwebengine_import.qml gui\src\qml\
          # Copy release runtime outputs, including transitive dependencies.
          # hidapi/fftw are not dependencies in this Windows manifest.
          $runtimeDirs = @(
            "build/gui",
            "$env:VCPKG_INSTALLED_DIR/${{ env.triplet }}/bin",
            "${{ github.workspace }}/${{ env.dep_folder }}/bin"
          )
          foreach ($runtimeDir in $runtimeDirs) {
            if (!(Test-Path $runtimeDir)) { throw "Runtime directory missing: $runtimeDir" }
            Get-ChildItem -Path $runtimeDir -Filter "*.dll" -File |
              Copy-Item -Destination chiaki-ng-Win -Force
          }
          # deps is copied last so SDL2-compat and SDL3 remain the packaged pair.
          foreach ($required in @("chiaki.exe", "cpp-steam-tools.dll", "SDL2.dll", "SDL3.dll", "shaderc_shared.dll")) {
            if (!(Test-Path "chiaki-ng-Win/$required")) { throw "Missing runtime output: $required" }
          }
          windeployqt.exe --no-translations --qmldir=gui\src\qml --release chiaki-ng-Win\chiaki.exe
          if ($LASTEXITCODE -ne 0) { throw "Qt runtime deployment failed" }

      - name: Package chiaki-ng
        run: |
          $CHIAKI_VERSION_MAJOR = (Select-String -Path .\CMakeLists.txt -Pattern 'set\(CHIAKI_VERSION_MAJOR ([0-9]+)\)') | %{$_.Matches.Groups[1].value}
          $CHIAKI_VERSION_MINOR = (Select-String -Path .\CMakeLists.txt -Pattern 'set\(CHIAKI_VERSION_MINOR ([0-9]+)\)') | %{$_.Matches.Groups[1].value}
          $CHIAKI_VERSION_PATCH = (Select-String -Path .\CMakeLists.txt -Pattern 'set\(CHIAKI_VERSION_PATCH ([0-9]+)\)') | %{$_.Matches.Groups[1].value}
          $RELEASE_PACKAGE_FILE = "chiaki-ng-win_x64-VC-portable-$CHIAKI_VERSION_MAJOR.$CHIAKI_VERSION_MINOR.$CHIAKI_VERSION_PATCH-test-build-${{ github.sha }}.zip"
          Compress-Archive chiaki-ng-Win $RELEASE_PACKAGE_FILE
          $release_filepath = Get-ChildItem $RELEASE_PACKAGE_FILE | %{$_[0].FullName}
          echo "RELEASE_PACKAGE_PATH=$release_filepath" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-win_x64-VC-Release
          path: ${{ env.RELEASE_PACKAGE_PATH }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload matching debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-win_x64-VC-symbols
          path: build/gui/*.pdb
          if-no-files-found: error
          retention-days: 30

      - name: Compile .ISS to .EXE Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: "scripts/chiaki-ng.iss"
          options: /O+

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-win_x64-VC-installer.zip
          path: chiaki-ng-windows-installer.exe
          if-no-files-found: error
          retention-days: 7
