name: Session lifecycle regression tests

on:
  push:
    paths:
      - 'gui/**'
      - 'test/session-lifecycle/**'
      - '.github/workflows/session-lifecycle-tests.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S test/session-lifecycle -B build-lifecycle -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build-lifecycle --config Debug
      - run: ctest --test-dir build-lifecycle -C Debug --output-on-failure --timeout 30
